title = "ExchangeHub - configuración de gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conocidos: datos ficticios de pruebas y de la plantilla de Nest"
regexes = [
  '''clave-segura-123''',
  '''otra-clave-123''',
  '''abc123def456''',
  # Contraseñas ficticias de las pruebas de recuperación de contraseña
  '''otra-clave-nueva-456''',
  '''una-tercera-clave-789''',
  '''uno-clave-1234''',
  '''dos-clave-5678''',
  '''clave-nueva-123''',
  '''clave-nueva-124''',
  '''incorrecta-123''',
  # Usuarios y datos de las pruebas de carga (loadtest/): la clave y su hash bcrypt son ficticios
  '''carga-prueba-123''',
  '''\$2b\$10\$f1UFrENJoYa/jo55mKLDKumJpgUCGO08L3zg0qCMkLNEU57Er9EBq''',
]
