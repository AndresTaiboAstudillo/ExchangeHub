# Los valores se leen del archivo .env de la raíz (copia .env.example).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      # Solo para desarrollo (prisma migrate dev desde tu máquina).
      # En staging/producción elimina esta publicación de puerto.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-service:
    build: ./pythonservice
    restart: unless-stopped
    # Sin "ports": solo es accesible desde la red interna de Docker.
    expose:
      - "8001"
    environment:
      # Se incluye en el User-Agent de las descargas a Mineduc y Wikidata.
      PIPELINE_CONTACT: ${PIPELINE_CONTACT:-sin-contacto-configurado}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Si el Ministerio no permite la descarga automática (robots.txt), descarga el Excel a mano,
      # móntalo en el contenedor (volumes) y descomenta la línea:
      # MINEDUC_CATALOG_FILE: /data/ies_vigentes.xlsx
    # volumes:
    #   - ./datos/ies_vigentes.xlsx:/data/ies_vigentes.xlsx:ro

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PYTHON_SERVICE_URL: http://python-service:8001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PYTHON_PIPELINE_TIMEOUT_MS: ${PYTHON_PIPELINE_TIMEOUT_MS:-120000}
      # 0 = solo manual. 168 = revisar las fuentes una vez por semana.
      INGESTION_INTERVAL_HOURS: ${INGESTION_INTERVAL_HOURS:-0}
      # Correo de recuperación de contraseña. Por defecto va al buzón de pruebas Mailpit (abajo);
      # en producción apunta a tu proveedor SMTP real. Si TRUST_PROXY está detrás de un proxy: 1.
      FRONTEND_URL: ${FRONTEND_URL:-}
      SMTP_HOST: ${SMTP_HOST-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ExchangeHub <no-reply@exchangehub.local>}
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      python-service:
        condition: service_started

  # Buzón de pruebas: recibe los correos del backend sin enviarlos a nadie.
  # Bandeja en http://localhost:8025 (solo desde tu máquina). Quítalo al usar un SMTP real.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  # Punto de entrada único (opcional) para exponer la app con un solo túnel (ngrok, etc.): las páginas
  # van al frontend y la API y el chat al backend. Ver docs/pruebas-con-usuarios.md. Solo local: 127.0.0.1:8080.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
